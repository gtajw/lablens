[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lablens-api"
version = "1.0.0"
description = "Reproducible dimensional reasoning for school lab data"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi==0.141.1", "uvicorn[standard]==0.54.0", "sqlalchemy==2.1.1",
  "psycopg[binary]==3.3.6", "alembic==1.20.0", "pint==0.26.1",
  "numpy==2.5.3", "scipy==1.18.1", "pydantic-settings==2.15.0",
  "python-multipart==0.0.32", "PyJWT==2.15.0", "httpx==0.28.1"
]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "pytest-cov==7.1.0", "hypothesis==6.168.1", "ruff==0.16.9", "pip-audit==2.10.1"]

[tool.hatch.build.targets.wheel]
packages = ["apps/api/src/lablens"]

[tool.pytest.ini_options]
testpaths = ["apps/api/tests"]
pythonpath = ["apps/api/src"]
addopts = "-ra"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.coverage.run]
branch = true
source = ["lablens"]

[tool.coverage.report]
show_missing = true
