name: Verify LabLens
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: local-ci-only
          POSTGRES_DB: lablens_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d lablens_test"
          --health-interval 5s --health-timeout 3s --health-retries 15
    env:
      LABLENS_DATABASE_URL: postgresql+psycopg://postgres:local-ci-only@127.0.0.1:5432/lablens_test
      LABLENS_ENVIRONMENT: test
      NEXT_TELEMETRY_DISABLED: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/setup-node@v4
        with: {node-version: '24', cache: npm}
      - run: python -m pip install --require-hashes -r requirements-dev.lock
      - run: python -m pip install --no-deps -e .
      - run: npm ci
      - run: ruff check apps/api scripts
      - run: npm run typecheck
      - run: npm run build
      - run: python scripts/verify.py --browser
      - run: npm audit --omit=dev --audit-level=moderate
      - run: pip-audit --disable-pip --no-deps -r requirements.lock
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-evidence
          path: |
            docs/coverage.json
            docs/test-results.xml
            docs/browser-results.json
            docs/submission/screenshots/
            test-results/
